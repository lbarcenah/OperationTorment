<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operación Tormenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 60px rgba(255,120,40,.15)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
// ================== SETUP ==================
const VW = 480, VH = 270, GROUND = 232, G = 900;
const ARENA_X = 3720, BOSS_HP = 360;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH;
function fit() { const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; }
addEventListener('resize', fit); fit();
ctx.imageSmoothingEnabled = false;
const FONT = '"Press Start 2P", monospace';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

// ================== INPUT ==================
const MAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  jump: ['KeyZ', 'KeyK', 'Space'], shoot: ['KeyX', 'KeyJ'], bomb: ['KeyC', 'KeyL'],
  start: ['Enter'], pause: ['KeyP', 'Escape'], mute: ['KeyM'],
};
const keys = {}, pressed = {};
let gpNow = {}, gpPrev = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  ac();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const held = n => MAP[n].some(k => keys[k]) || !!gpNow[n];
const hit = n => MAP[n].some(k => pressed[k]) || (!!gpNow[n] && !gpPrev[n]);
function pollGamepad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const g = gps && gps[0], s = {};
  if (g) {
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0, b = i => g.buttons[i] && g.buttons[i].pressed;
    s.left = ax < -.4 || b(14); s.right = ax > .4 || b(15); s.up = ay < -.5 || b(12); s.down = ay > .5 || b(13);
    s.jump = b(0); s.shoot = b(2) || b(7); s.bomb = b(1) || b(3); s.start = b(9); s.pause = b(9);
  }
  gpNow = s;
}

// ================== AUDIO ==================
let AC = null, master = null, noiseBuf = null, muted = false;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .45; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', v = .1, f2 = null, t0 = 0) {
  if (!AC || muted) return;
  const t = t0 || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .2, ftype = 'lowpass', freq = 1000, t0 = 0, f2 = null) {
  if (!AC || muted) return;
  const t = t0 || AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.setValueAtTime(freq, t);
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(master); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
const sfx = {
  pistol() { noise(.07, .18, 'highpass', 1500); tone(700, .06, 'square', .05, 180); },
  mg() { noise(.05, .16, 'bandpass', 1800); tone(400, .04, 'square', .04, 120); },
  shotgun() { noise(.25, .35, 'lowpass', 3000, 0, 300); tone(160, .15, 'square', .08, 50); },
  enemyShot() { tone(500, .08, 'square', .03, 250); },
  boom(r = 20) { const v = Math.min(.6, .2 + r / 80); noise(.3 + r / 60, v, 'lowpass', 900, 0, 60); tone(110, .3 + r / 100, 'sine', v * .8, 28); },
  hit() { tone(1200, .03, 'square', .03, 600); },
  bossHit() { noise(.04, .08, 'highpass', 3000); },
  throw() { tone(300, .12, 'triangle', .06, 600); },
  jump() { tone(220, .1, 'triangle', .05, 440); },
  pickup() { [0, 4, 7, 12].forEach((s, i) => tone(660 * 2 ** (s / 12), .1, 'square', .06, null, AC ? AC.currentTime + i * .05 : 0)); },
  free() { [0, 7, 12, 16].forEach((s, i) => tone(523 * 2 ** (s / 12), .12, 'triangle', .09, null, AC ? AC.currentTime + i * .07 : 0)); },
  die() { tone(600, .6, 'square', .08, 60); noise(.3, .15, 'lowpass', 800); },
  enemyDie() { tone(300, .15, 'sawtooth', .04, 80); },
  alarm() { if (!AC) return; for (let i = 0; i < 4; i++) { tone(440, .25, 'sawtooth', .07, 880, AC.currentTime + i * .5); tone(880, .25, 'sawtooth', .07, 440, AC.currentTime + i * .5 + .25); } },
  cannon() { noise(.4, .4, 'lowpass', 1200, 0, 80); tone(80, .35, 'sine', .3, 30); },
  laserCharge() { tone(120, 1.2, 'sawtooth', .06, 900); },
  laser() { noise(.6, .25, 'bandpass', 2400); tone(90, .6, 'sawtooth', .12, 70); },
  missile() { noise(.3, .12, 'bandpass', 900, 0, 3000); },
};

// ---------- Music sequencer ----------
const TRACKS = {
  level: { bpm: 150, root: 110, lroot: 220,
    bass: [0, 0, 12, 0, 0, 12, 10, 12, 5, 5, 17, 5, 7, 7, 19, 7],
    lead: [12, null, 15, null, 19, null, 17, 15, 12, null, null, 10, 12, null, null, null,
           19, null, 22, null, 24, null, 22, 19, 17, null, 15, null, 17, null, 19, null] },
  boss: { bpm: 172, root: 98, lroot: 196,
    bass: [0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 12, 0, 10, 0, 7, 6],
    lead: [12, null, 12, 13, 12, null, 19, 18, 12, null, 12, 13, 15, null, 13, null,
           24, null, 22, null, 19, null, 18, 19, 15, null, 13, null, 12, null, null, null] },
};
const music = { track: null, step: 0, next: 0 };
function setMusic(name) { music.track = name ? TRACKS[name] : null; music.step = 0; if (AC) music.next = AC.currentTime + .1; }
function musicTick() {
  if (!AC || !music.track) return;
  const T = music.track, spb = 60 / T.bpm / 2;
  if (music.next < AC.currentTime) music.next = AC.currentTime + .02;
  while (music.next < AC.currentTime + .15) {
    const i = music.step, t = music.next;
    if (!muted) {
      const b = T.bass[i % T.bass.length];
      if (b !== null) tone(T.root * 2 ** (b / 12), spb * .9, 'square', .035, null, t);
      const l = T.lead[i % T.lead.length];
      if (l !== null) tone(T.lroot * 2 ** (l / 12), spb * 1.6, 'triangle', .045, null, t);
      if (i % 4 === 0) tone(150, .12, 'sine', .22, 40, t);
      if (i % 8 === 4) noise(.1, .1, 'bandpass', 1800, t);
      noise(.03, .025, 'highpass', 7000, t);
    }
    music.step++; music.next += spb;
  }
}

// ================== LEVEL DATA ==================
const PLATS = [
  { x: 520, y: 194, w: 80, k: 'crates' },
  { x: 900, y: 182, w: 110, k: 'scaffold' },
  { x: 1090, y: 152, w: 100, k: 'scaffold' },
  { x: 1520, y: 186, w: 140, k: 'ruin' },
  { x: 2250, y: 176, w: 110, k: 'scaffold' },
  { x: 2720, y: 182, w: 90, k: 'crates' },
  { x: 2930, y: 160, w: 100, k: 'scaffold' },
  { x: 3760, y: 178, w: 70, k: 'crates' },
  { x: 3870, y: 150, w: 60, k: 'scaffold' },
];
const DECOR = [
  { k: 'sign', x: 90 }, { k: 'sandbags', x: 300 }, { k: 'jeep', x: 700 }, { k: 'wire', x: 1250 },
  { k: 'sandbags', x: 1450 }, { k: 'jeep', x: 1900 }, { k: 'wire', x: 2150 }, { k: 'sandbags', x: 2600 },
  { k: 'wire', x: 3230 }, { k: 'jeep', x: 3480 }, { k: 'flag', x: 3700 },
];
// [trigger world x, spawn fn] — fires when the right edge of the camera reaches x
const LEVEL = [
  [500, () => { soldier(540); soldier(600); }],
  [640, () => { hostage(680, 'M'); }],
  [760, () => { soldier(800); barrel(840); soldier(880); soldier(940, GROUND, { g: 1 }); }],
  [930, () => { soldier(950, 182, { stay: 1 }); soldier(1130, 152, { stay: 1, g: 1 }); soldier(1060); }],
  [1240, () => { turret(1330); soldier(1260); barrel(1295); }],
  [1530, () => { soldier(1560, 186, { stay: 1 }); soldier(1620, 186, { stay: 1 }); hostage(1720, 'B'); }],
  [1780, () => { drone(1840); drone(1920); }],
  [1990, () => { tank(2080); soldier(2010); }],
  [2260, () => { soldier(2290, 176, { stay: 1, g: 1 }); hostage(2370, 'S'); barrel(2420); soldier(2450); soldier(2490); }],
  [3180, () => { soldier(3190); turret(3290); drone(3260); }],
  [3400, () => { hostage(3420, 'M'); soldier(3460); soldier(3500, GROUND, { g: 1 }); barrel(3530); }],
];
const AMBUSH_X = 2640;
const WAVES = [
  () => { soldier(cam.x + VW + 10); soldier(cam.x + VW + 40); soldier(cam.x - 15); },
  () => { soldier(2760, -20, { stay: 1 }); drone(cam.x + VW + 20); soldier(cam.x + VW + 20, GROUND, { g: 1 }); soldier(cam.x - 15); },
  () => { tank(cam.x + VW + 40); drone(cam.x - 30); soldier(cam.x + VW + 70); soldier(2970, -20, { stay: 1 }); },
];

// ================== STATE ==================
let state = 'title', time = 0, score = 0, hiscore = 0;
let cam = { x: 0 }, shake = 0, flashW = 0;
let player, enemies, pB, eB, grens, parts, exps, pops, picks, hosts, flashes, timers, wrecks;
let boss, bossStarted, bossSpawnT, winT, spawnIdx, ambush, goT, banner, stats, continueT, laser;
try { hiscore = +localStorage.getItem('tormentaHi') || 0; } catch {}

function mkPlayer(x) {
  return { x, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true, onPlat: false, crouch: false, pose: 'fwd',
    weapon: 'pistol', ammo: 0, bombs: 10, cool: 0, gcool: 0, inv: 2, dead: false, deadT: 0, run: 0,
    lives: 3, dropT: 0, shootAnim: 0, moving: false };
}
function newGame() {
  score = 0; stats = { kills: 0, hostages: 0, time: 0 };
  cam = { x: 0 };
  player = mkPlayer(60);
  enemies = []; pB = []; eB = []; grens = []; parts = []; exps = []; pops = []; picks = []; hosts = [];
  flashes = []; timers = []; wrecks = [];
  boss = null; bossStarted = false; bossSpawnT = 0; winT = 0; laser = null;
  spawnIdx = 0; ambush = { active: false, done: false, wi: 0, wait: 0 };
  goT = 0; showBanner('MISIÓN 1', '¡ADELANTE, SOLDADO!', 2.5);
  state = 'play'; setMusic('level');
  if (location.hash === '#boss') { player.x = 3800; cam.x = ARENA_X; spawnIdx = LEVEL.length; ambush.done = true; }
}
function showBanner(t, s, life, warn = false) { banner = { t, s, life, max: life, warn }; }
function after(t, fn) { timers.push({ t, fn }); }

// ================== SPAWNERS ==================
function soldier(x, y = GROUND, o = {}) {
  enemies.push({ type: 'soldier', x, y, vx: 0, vy: 0, w: 12, h: 26, hp: 1, face: -1, cool: rnd(1, 2.2),
    stay: !!o.stay, g: !!o.g, run: 0, flash: 0, dead: false, deadT: 0, shootAnim: 0, keep: rnd(90, 160), onGround: false });
}
function turret(x) { enemies.push({ type: 'turret', x, y: GROUND, w: 34, h: 22, hp: 12, cool: 1.5, burst: 0, bt: 0, ang: Math.PI, flash: 0, dead: false }); }
function drone(x, small = false) {
  enemies.push({ type: 'drone', x, y: -20, vx: 0, vy: 0, w: small ? 18 : 26, h: small ? 10 : 14, hp: small ? 3 : 6,
    base: rnd(55, 95), t: rnd(0, 6), cool: rnd(1, 2), flash: 0, dead: false, deadT: 0, rot: 0, small });
}
function tank(x) { enemies.push({ type: 'tank', x, y: GROUND, w: 56, h: 32, hp: 30, cool: 2, face: -1, flash: 0, dead: false, tread: 0, recoil: 0 }); }
function barrel(x) { enemies.push({ type: 'barrel', x, y: GROUND, w: 12, h: 16, hp: 3, flash: 0, dead: false }); }
function hostage(x, item) { hosts.push({ x, y: GROUND, item, state: 'tied', t: rnd(0, 3), face: -1 }); }
function supplyDrop(x, kind) { picks.push({ x, y: -20, vy: 35, kind, chute: true, landed: false, t: 0 }); }

// ================== FX ==================
function part(x, y, vx, vy, life, col, size, o = {}) {
  parts.push({ x, y, vx, vy, life, max: life, col, size, g: o.g || 0, add: !!o.add, smoke: !!o.smoke, bounce: !!o.bounce, grow: o.grow || 0, fire: !!o.fire, drag: o.drag ?? .96 });
}
function sparks(x, y, n = 6, col = '#ffe066', sp = 120) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(.3, 1) * sp; part(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(.1, .3), col, rnd(1, 2), { add: true }); } }
function smokePuff(x, y, n = 1, size = 4) { for (let i = 0; i < n; i++) part(x + rnd(-3, 3), y + rnd(-3, 3), rnd(-10, 10), rnd(-35, -15), rnd(.6, 1.2), '#555', size, { smoke: true, grow: 6, drag: .98 }); }
function pop(x, y, txt, col = '#fff') { pops.push({ x, y, txt, col, t: 1 }); }
function explode(x, y, r = 20, o = {}) {
  exps.push({ x, y, r, t: 0, max: .45 + r / 120 });
  const n = Math.min(60, r * 1.2 | 0);
  for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(.2, 1) * r * 5; part(x, y, Math.cos(a) * s, Math.sin(a) * s - 20, rnd(.25, .6), null, rnd(2, 4), { add: true, fire: true, drag: .9 }); }
  for (let i = 0; i < n / 2; i++) smokePuff(x + rnd(-r, r) * .5, y + rnd(-r, r) * .4, 1, rnd(4, 8));
  for (let i = 0; i < n / 4; i++) part(x, y, rnd(-1, 1) * r * 6, rnd(-1.2, -.3) * r * 7, rnd(.6, 1.2), '#3a2a1a', rnd(1, 3), { g: 600, bounce: true, drag: .99 });
  shake = Math.max(shake, r / 3.5); flashW = Math.max(flashW, r / 300);
  sfx.boom(r);
  if (o.hurtsEnemies) {
    for (const e of enemies.slice()) {
      if (e.dead) continue;
      const cx = e.x, cy = e.y - e.h / 2;
      if (Math.hypot(cx - x, cy - y) < r + Math.max(e.w, e.h) / 2) damage(e, o.dmg || 10, 'blast');
    }
    for (const h of hosts) if (h.state === 'tied' && Math.abs(h.x - x) < r + 8 && Math.abs(GROUND - 15 - y) < r + 15) freeHostage(h);
    if (boss && boss.state === 'fight' && inRect(clamp(x, boss.x, boss.x + 165), clamp(y, GROUND - 108, GROUND), { x: x - r, y: y - r, w: r * 2, h: r * 2 })) hitBoss(o.dmg || 10, x, y);
  }
  if (o.hurtsPlayer && !player.dead) {
    const R = prect(), nx = clamp(x, R.x, R.x + R.w), ny = clamp(y, R.y, R.y + R.h);
    if (Math.hypot(nx - x, ny - y) < r * .75) hurtPlayer();
  }
}

// ================== PLAYER ==================
const prect = () => { const h = player.crouch ? 17 : 25; return { x: player.x - 5, y: player.y - h, w: 10, h }; };
function land(o, prevY) {
  o.onGround = false; o.onPlat = false;
  if (o.vy < 0) return;
  if (o.y >= GROUND) { o.y = GROUND; o.vy = 0; o.onGround = true; return; }
  if (o.dropT > 0) return;
  for (const p of PLATS) {
    if (o.x > p.x - 2 && o.x < p.x + p.w + 2 && prevY <= p.y + .5 && o.y >= p.y) { o.y = p.y; o.vy = 0; o.onGround = true; o.onPlat = true; return; }
  }
}
const WNAMES = { pistol: 'PISTOLA', mg: 'AMETRALL.', shotgun: 'ESCOPETA' };
function muzzle() {
  const P = player, cr = P.crouch ? 7 : 0;
  if (P.pose === 'up') return { x: P.x + P.face * 1.5, y: P.y - 41 + cr, dx: 0, dy: -1 };
  if (P.pose === 'down') return { x: P.x + P.face * 1.5, y: P.y + 3, dx: 0, dy: 1 };
  const L = P.weapon === 'pistol' ? 11 : 15;
  return { x: P.x + P.face * (3 + L), y: P.y - 17 + cr, dx: P.face, dy: 0 };
}
function fire() {
  const P = player, m = muzzle(), base = Math.atan2(m.dy, m.dx);
  P.shootAnim = .08;
  flashes.push({ x: m.x, y: m.y, a: base, t: .05, s: P.weapon === 'shotgun' ? 10 : 6 });
  if (P.weapon === 'pistol') {
    pB.push({ x: m.x, y: m.y, vx: Math.cos(base) * 430, vy: Math.sin(base) * 430, dmg: 1, life: 1.2, k: 'p' });
    P.cool = .13; sfx.pistol();
  } else if (P.weapon === 'mg') {
    const a = base + rnd(-.06, .06);
    pB.push({ x: m.x, y: m.y + rnd(-1.5, 1.5), vx: Math.cos(a) * 470, vy: Math.sin(a) * 470, dmg: 1, life: 1.2, k: 'm' });
    P.cool = .065; P.ammo--; sfx.mg();
    part(P.x, P.y - 17, -P.face * rnd(30, 70), rnd(-120, -60), 1.2, '#e8c050', 1.5, { g: 600, bounce: true, drag: .99 });
  } else {
    for (let i = 0; i < 7; i++) { const a = base + rnd(-.22, .22), s = rnd(340, 420); pB.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, dmg: 2, life: .22, k: 's' }); }
    for (let i = 0; i < 6; i++) smokePuff(m.x + m.dx * 6, m.y + m.dy * 6, 1, 3);
    P.cool = .5; P.ammo--; shake = Math.max(shake, 3); sfx.shotgun();
  }
  if (P.weapon !== 'pistol' && P.ammo <= 0) { P.weapon = 'pistol'; pop(P.x, P.y - 40, 'SIN MUNICIÓN', '#ff6b6b'); }
}
function updatePlayer(dt) {
  const P = player;
  P.inv -= dt; P.shootAnim -= dt; P.dropT -= dt; P.cool -= dt; P.gcool -= dt;
  if (P.dead) {
    P.deadT += dt; P.vy += G * dt; P.x += P.vx * dt; P.y += P.vy * dt;
    if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.vx *= .8; }
    if (P.deadT > 1.7) respawn();
    return;
  }
  const mx = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  if (mx) P.face = mx;
  P.crouch = held('down') && P.onGround;
  P.pose = held('up') ? 'up' : (held('down') && !P.onGround ? 'down' : 'fwd');
  P.vx = mx * (P.crouch ? 45 : 105);
  P.moving = !!mx;
  if (hit('jump') && P.onGround) {
    if (held('down') && P.onPlat) { P.dropT = .25; P.y += 2; P.onGround = false; }
    else { P.vy = -370; P.onGround = false; sfx.jump(); for (let i = 0; i < 5; i++) part(P.x, P.y, rnd(-40, 40), rnd(-30, -5), .4, '#c9a06a', 2, { smoke: true, grow: 2 }); }
  }
  const wasGround = P.onGround, prevY = P.y;
  P.vy += G * dt; P.x += P.vx * dt; P.y += P.vy * dt;
  land(P, prevY);
  if (!wasGround && P.onGround) for (let i = 0; i < 4; i++) part(P.x, P.y, rnd(-50, 50), rnd(-20, -5), .35, '#c9a06a', 2, { smoke: true, grow: 2 });
  P.x = clamp(P.x, cam.x + 8, cam.x + VW - 8);
  if (boss && boss.state !== 'dead' && P.x > boss.x - 6) P.x = boss.x - 6;
  P.run += dt * (mx ? 13 : 0);

  const auto = P.weapon === 'mg';
  if ((auto ? held('shoot') : hit('shoot')) && P.cool <= 0) fire();
  if (hit('bomb') && P.bombs > 0 && P.gcool <= 0) {
    P.bombs--; P.gcool = .35; sfx.throw();

    drawOverlayText('¡MISIÓN CUMPLIDA!', '#ffd84a', [
      ['PUNTOS  ' + score, '#fff'], ['ENEMIGOS  ' + stats.kills, '#fff'], ['REHENES  ' + stats.hostages + '/5', '#7dffb0'], ['TIEMPO  ' + m + ':' + s, '#fff'],
      ['RANGO ' + rank, '#ff8a2a', 16], [''], ['ENTER PARA VOLVER', '#bbb', 6]]);
  }
}

// ================== LOOP ==================
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.max(0, Math.min(.033, (now - last) / 1000)); last = now;
  try {
    pollGamepad();
    update(dt);
    render();
  } catch (err) { console.error(err); }
  for (const k in pressed) delete pressed[k];
  gpPrev = gpNow;
}
newGame(); state = 'title'; setMusic(null);
requestAnimationFrame(loop);
window.__game = { get state() { return state; }, get player() { return player; }, get boss() { return boss; }, get enemies() { return enemies; }, get cam() { return cam; }, get score() { return score; } };
})();
</script>
